services:

  agro-marketplace-db:
    container_name: agro-marketplace
    image: postgres:16-alpine
    restart: always
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=agro-marketplace

  redis:
    container_name: redis_agro_marketplace
    image: redis:alpine
    restart: always
    ports:
      - 6379:6379